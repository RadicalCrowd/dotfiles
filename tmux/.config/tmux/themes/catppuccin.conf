# Catppuccin Mocha Palette for Tmux
thm_bg="#1e1e2e"
thm_fg="#cdd6f4"
thm_cyan="#89dceb"
thm_black="#181825"
thm_gray="#313244"
thm_magenta="#cba6f7"
thm_pink="#f5c2e7"
thm_red="#f38ba8"
thm_green="#a6e3a1"
thm_yellow="#f9e2af"
thm_blue="#89b4fa"
thm_orange="#fab387"
thm_surface2="#585b70"

# Status bar
set -g status-style "bg=${thm_bg},fg=${thm_fg}"
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue}"
set -g message-style "bg=${thm_magenta},fg=${thm_bg},bold"
set -g message-command-style "bg=${thm_magenta},fg=${thm_bg},bold"
set -g mode-style "bg=${thm_blue},fg=${thm_black},bold"

# Window tabs
setw -g window-status-style "bg=${thm_bg},fg=${thm_surface2}"
setw -g window-status-current-style "bg=${thm_blue},fg=${thm_black},bold"
setw -g window-status-format " #[fg=${thm_surface2}]#I:#[fg=${thm_fg}]#W "
setw -g window-status-current-format " #[fg=${thm_black}]#I:#W "
