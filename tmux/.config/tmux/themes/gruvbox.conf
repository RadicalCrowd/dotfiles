# ==============================================================================
# Gruvbox Retro Dark Palette — Monospace Punctuation Visual Language
# Styled to match Starship shell prompt: [ ] { } \ | ; : < > , . ? / ! * + -
# ==============================================================================

thm_bg="#282828"
thm_fg="#ebdbb2"
thm_gray="#504945"
thm_green="#b8bb26"
thm_yellow="#fabd2f"
thm_blue="#83a598"
thm_purple="#d3869b"
thm_aqua="#8ec07c"
thm_orange="#fe8019"
thm_red="#fb4934"
thm_surface2="#665c54"

# Status bar generic
set -g status-style "bg=${thm_bg},fg=${thm_fg}"
set -g status-left-length 40
set -g status-right-length 80
set -g status-interval 2

# Pane borders
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_yellow}"

# Message & command styles
set -g message-style "bg=${thm_gray},fg=${thm_yellow},bold"
set -g message-command-style "bg=${thm_gray},fg=${thm_aqua},bold"
set -g mode-style "bg=${thm_gray},fg=${thm_yellow},bold"

# ------------------------------------------------------------------------------
# Left Status: Scope separator and session container "[session] :: "
# ------------------------------------------------------------------------------
set -g status-left "#[fg=${thm_aqua},bold][#[fg=${thm_fg}]#S#[fg=${thm_aqua}]]#[fg=${thm_surface2}] :: "

# ------------------------------------------------------------------------------
# Window Tabs: Punctuation indicators
# Inactive: [#I:#W]
# Active:   [!#I:#W!]
# ------------------------------------------------------------------------------
setw -g window-status-style "bg=${thm_bg},fg=${thm_surface2}"
setw -g window-status-current-style "bg=${thm_bg},fg=${thm_yellow},bold"

setw -g window-status-format "#[fg=${thm_surface2}][#[fg=${thm_surface2}]#I#[fg=${thm_surface2}]:#[fg=${thm_fg}]#W#{?window_zoomed_flag,#[fg=${thm_yellow}][z],}#[fg=${thm_surface2}]] "
setw -g window-status-current-format "#[fg=${thm_yellow},bold][#[fg=${thm_green}]!#[fg=${thm_yellow}]#I#[fg=${thm_surface2}]:#[fg=${thm_fg}]#W#[fg=${thm_orange}]#{?window_zoomed_flag,[*z*],}#[fg=${thm_green}]!#[fg=${thm_yellow}]] "

# ------------------------------------------------------------------------------
# Right Status: " :: [; %H:%M] | <#h> "
# ------------------------------------------------------------------------------
set -g status-right "#[fg=${thm_surface2}]:: #[fg=${thm_yellow}][#[fg=${thm_fg}]; %H:%M#[fg=${thm_yellow}]] #[fg=${thm_surface2}]| #[fg=${thm_purple}]<#h> "
