# Gruvbox Retro Dark Palette for Tmux
thm_bg="#282828"
thm_fg="#ebdbb2"
thm_gray="#504945"
thm_green="#b8bb26"
thm_yellow="#fabd2f"
thm_blue="#83a598"
thm_purple="#d3869b"
thm_aqua="#8ec07c"
thm_orange="#fe8019"
thm_red="#fb4934"
thm_surface2="#665c54"

# Status bar
set -g status-style "bg=${thm_bg},fg=${thm_fg}"
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_yellow}"
set -g message-style "bg=${thm_yellow},fg=${thm_bg},bold"
set -g message-command-style "bg=${thm_yellow},fg=${thm_bg},bold"
set -g mode-style "bg=${thm_yellow},fg=${thm_bg},bold"

# Window tabs
setw -g window-status-style "bg=${thm_bg},fg=${thm_surface2}"
setw -g window-status-current-style "bg=${thm_yellow},fg=${thm_bg},bold"
setw -g window-status-format " #[fg=${thm_surface2}]#I:#[fg=${thm_fg}]#W "
setw -g window-status-current-format " #[fg=${thm_bg}]#I:#W "
