# ==============================================================================
# Kanagawa Dragon Palette — Monospace Punctuation Visual Language
# Styled to match Starship shell prompt: [ ] { } \ | ; : < > , . ? / ! * + -
# ==============================================================================

thm_bg="#12120f"
thm_fg="#c5c9c5"
thm_cyan="#7aa89f"
thm_black="#0d0c0c"
thm_gray="#223249"
thm_magenta="#957fb8"
thm_pink="#d27e99"
thm_red="#c34043"
thm_green="#76946a"
thm_yellow="#c0a36e"
thm_blue="#7e9cd8"
thm_orange="#ffa066"
thm_surface2="#727169"

# Status bar generic
set -g status-style "bg=${thm_bg},fg=${thm_fg}"
set -g status-left-length 40
set -g status-right-length 80
set -g status-interval 2

# Pane borders
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_cyan}"

# Message & command styles
set -g message-style "bg=${thm_black},fg=${thm_cyan},bold"
set -g message-command-style "bg=${thm_black},fg=${thm_magenta},bold"
set -g mode-style "bg=${thm_gray},fg=${thm_cyan},bold"

# ------------------------------------------------------------------------------
# Left Status: Scope separator and session container "[session] :: "
# ------------------------------------------------------------------------------
set -g status-left "#[fg=${thm_cyan},bold][#[fg=${thm_fg}]#S#[fg=${thm_cyan}]]#[fg=${thm_surface2}] :: "

# ------------------------------------------------------------------------------
# Window Tabs: Punctuation indicators
# Inactive: [#I:#W]
# Active:   [!#I:#W!]
# ------------------------------------------------------------------------------
setw -g window-status-style "bg=${thm_bg},fg=${thm_surface2}"
setw -g window-status-current-style "bg=${thm_bg},fg=${thm_cyan},bold"

setw -g window-status-format "#[fg=${thm_surface2}][#[fg=${thm_surface2}]#I#[fg=${thm_surface2}]:#[fg=${thm_fg}]#W#{?window_zoomed_flag,#[fg=${thm_yellow}][z],}#[fg=${thm_surface2}]] "
setw -g window-status-current-format "#[fg=${thm_cyan},bold][#[fg=${thm_green}]!#[fg=${thm_cyan}]#I#[fg=${thm_surface2}]:#[fg=${thm_fg}]#W#[fg=${thm_yellow}]#{?window_zoomed_flag,[*z*],}#[fg=${thm_green}]!#[fg=${thm_cyan}]] "

# ------------------------------------------------------------------------------
# Right Status: " :: [; %H:%M] | <#h> "
# ------------------------------------------------------------------------------
set -g status-right "#[fg=${thm_surface2}]:: #[fg=${thm_yellow}][#[fg=${thm_fg}]; %H:%M#[fg=${thm_yellow}]] #[fg=${thm_surface2}]| #[fg=${thm_magenta}]<#h> "
