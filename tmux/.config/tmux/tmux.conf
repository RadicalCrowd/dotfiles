# ==============================================================================
# TMUX CONFIGURATION (Managed via GNU Stow in ~/dotfiles)
# Architecture: SpaceFN Layer (via keyd) + Standalone Themes + Dedicated Sidebar
# ==============================================================================

# Extended keys (csi-u protocol for Ghostty, Kitty, Foot)
set -g extended-keys on
set -g extended-keys-format csi-u

# Terminal capabilities & true color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,foot:RGB,kitty:RGB,ghostty:RGB"

# Fast response time (no escape delay)
set -s escape-time 0
set -g history-limit 50000
set -g focus-events on

# ------------------------------------------------------------------------------
# Prefix Configuration (Fallback for SSH or when keyd is not running)
# ------------------------------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
set -g prefix2 C-a
bind C-a send-prefix -2

# ------------------------------------------------------------------------------
# SpaceFN Direct Bindings (No Prefix Required)
# keyd captures [Hold Space + Key] and translates to Meta (Alt) chords.
# ------------------------------------------------------------------------------

# Directional Navigation (ESDF)
bind -n M-e select-pane -U
bind -n M-s select-pane -L
bind -n M-d select-pane -D
bind -n M-f select-pane -R

# Pane Operations
bind -n M-r split-window -h -c "#{pane_current_path}"
bind -n M-x split-window -v -c "#{pane_current_path}"
bind -n M-z resize-pane -Z
bind -n M-q confirm-before -p "kill-pane #P? (y/n)" kill-pane

# Window Management (1-indexed base)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind -n M-b new-window -c "#{pane_current_path}"

# Direct Window Jumps (Hold Space + Key)
bind -n M-2 select-window -t :1
bind -n M-3 select-window -t :2
bind -n M-4 select-window -t :3
bind -n M-5 select-window -t :4
bind -n M-g select-window -t :5
bind -n M-a select-window -t :6
bind -n M-w select-window -t :7
bind -n M-c select-window -t :8
bind -n M-t select-window -t :9

# ------------------------------------------------------------------------------
# Dedicated Left Sidebar & Theme Switching
# ------------------------------------------------------------------------------
# Space + \ toggles dedicated left sidebar pane
bind -n M-\\ run-shell "~/.config/tmux/scripts/sidebar-toggle.sh"

# Space + y toggles between Catppuccin Mocha and Gruvbox Retro Dark
bind -n M-y run-shell "~/.config/tmux/scripts/toggle-theme.sh"

# Config reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ------------------------------------------------------------------------------
# Mouse & Copy Mode (Wayland Native wl-copy + ESDF)
# ------------------------------------------------------------------------------
set -g mouse on
setw -g mode-keys vi

# Copy mode directional navigation (ESDF)
bind -T copy-mode-vi e send-keys -X cursor-up
bind -T copy-mode-vi s send-keys -X cursor-left
bind -T copy-mode-vi d send-keys -X cursor-down
bind -T copy-mode-vi f send-keys -X cursor-right

# Visual selection & yanking to system clipboard
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# Mouse drag auto-copy
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# ------------------------------------------------------------------------------
# Visual Theme (Defaults to Catppuccin Mocha)
# ------------------------------------------------------------------------------
source-file ~/.config/tmux/themes/catppuccin.conf
