# /etc/keyd/default.conf — SpaceFN Configuration for Tmux & Arch Linux
# Generated for ak10 workstation. Managed in ~/dotfiles/keyd.

[ids]
*

[main]
# Tap space emits Space; Hold space activates space_fn layer
space = overload(space_fn, space)

[space_fn]
# ESDF Pane Navigation -> Meta (Alt) Chords to Tmux
e = M-e
s = M-s
d = M-d
f = M-f

# Pane Operations
r = M-r
x = M-x
z = M-z
q = M-q

# Window (Tab) Management
b = M-b
2 = M-2
3 = M-3
4 = M-4
5 = M-5
g = M-g
a = M-a
w = M-w
c = M-c
t = M-t

# Utilities
\ = M-\
y = M-y
