# /etc/keyd/default.conf — SpaceFN Configuration for Tmux & Arch Linux
# Generated for ak10 workstation. Managed in ~/dotfiles/keyd.

[ids]
*

[global]
# Ignore tap behavior if an overloaded key is held longer than 250ms
overload_tap_timeout = 250

[main]
# overloadi emits space immediately on keydown if typed within 150ms of any letter (0 latency, no dropped spaces).
# When paused (>150ms), holding space longer than 180ms activates space_fn layer for navigation.
space = overloadi(space, overloadt(space_fn, space, 180), 150)

# Dual-role CapsLock: Tap emits Escape (Vim staple); Hold activates space_fn layer (instant navigation)
capslock = overload(space_fn, esc)

# ------------------------------------------------------------------------------
# SpaceFN Layer (Tmux Navigation & Window Management)
# ------------------------------------------------------------------------------
[space_fn]
# ESDF Pane Navigation -> Alt Chords to Tmux (Avoids GNOME Super conflicts)
e = A-e
s = A-s
d = A-d
f = A-f

# Pane Operations
r = A-r
x = A-x
z = A-z
q = A-q

# Window (Tab) Management
b = A-b
2 = A-2
3 = A-3
4 = A-4
5 = A-5
g = A-g
a = A-a
w = A-w
c = A-c
t = A-t

# Utilities
\ = A-\
y = A-y
