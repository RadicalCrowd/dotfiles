# /etc/keyd/default.conf — SpaceFN Configuration for Tmux & Arch Linux
# Generated for ak10 workstation. Managed in ~/dotfiles/keyd.

[ids]
*

[main]
# Tap space emits Space; Hold space activates space_fn layer
space = overload(space_fn, space)

# Game Mode Toggles (Disables SpaceFN so Space can be held continuously in Minecraft/games)
# Tap Right Alt, Insert, Pause, or Ctrl+Alt+Space to toggle Game Mode
rightalt = toggle(game)
insert = toggle(game)
pause = toggle(game)

[control+alt]
space = toggle(game)
g = toggle(game)

# ------------------------------------------------------------------------------
# Game Mode Layer (Vanilla Spacebar: full hold, jump, swim, sprint-jump)
# ------------------------------------------------------------------------------
[game]
space = space
rightalt = toggle(game)
insert = toggle(game)
pause = toggle(game)

# ------------------------------------------------------------------------------
# SpaceFN Layer (Tmux Navigation & Window Management)
# ------------------------------------------------------------------------------
[space_fn]
# Quick Game Mode trigger: Hold Space + Esc
esc = toggle(game)

# ESDF Pane Navigation -> Alt Chords to Tmux (Avoids GNOME Super conflicts)
e = A-e
s = A-s
d = A-d
f = A-f

# Pane Operations
r = A-r
x = A-x
z = A-z
q = A-q

# Window (Tab) Management
b = A-b
2 = A-2
3 = A-3
4 = A-4
5 = A-5
g = A-g
a = A-a
w = A-w
c = A-c
t = A-t

# Utilities
\ = A-\
y = A-y
